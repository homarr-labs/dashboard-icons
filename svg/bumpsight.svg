<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="bumpsight">
  <title>bumpsight — telescope cross-section</title>
  <!-- Foreshortened telescope viewed at angle — three nested ellipses receding -->
  <!-- Eyepiece (closest, largest) -->
  <ellipse cx="20" cy="48" rx="6" ry="14" fill="#2563eb" fill-opacity="0.08"/>
  <ellipse cx="20" cy="48" rx="6" ry="14"/>
  <!-- Mid-section -->
  <ellipse cx="48" cy="48" rx="5" ry="11"/>
  <!-- Objective lens (farthest, smallest) -->
  <ellipse cx="76" cy="48" rx="4" ry="8"/>
  <!-- Top edge of cylinder (perspective lines from large ring to small ring) -->
  <path d="M20 34 L48 37 L76 40"/>
  <!-- Bottom edge -->
  <path d="M20 62 L48 59 L76 56"/>
  <!-- Iris dot inside the eyepiece -->
  <circle cx="20" cy="48" r="2.5" fill="#2563eb" stroke="none"/>
</svg>
