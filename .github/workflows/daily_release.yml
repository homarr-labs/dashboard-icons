name: Daily Dashboard Icons Deployment

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger_deployment:
    runs-on: ubuntu-latest

    steps:
      # Reuse the image build, backup, backend verification, and frontend rollout.
      # workflow_dispatch works with GITHUB_TOKEN and avoids stale webhook URLs.
      - name: Trigger the current image and Dokploy deployment pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docker.yml --ref main -f verify_only=false
