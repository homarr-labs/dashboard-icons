name: Web verification

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_DISABLE_POSTHOG: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check changed source files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          mapfile -d '' files < <(git diff --relative --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- src)
          if (( ${#files[@]} )); then
            bun run -- biome check --no-errors-on-unmatched "${files[@]}"
          fi
          git diff --check "$BASE_SHA"...HEAD
      - name: Generate Next.js types
        run: bun run -- next typegen
      - name: Typecheck
        run: bun run -- tsc --noEmit --incremental false
      - name: Run full suite with enforced coverage
        run: bun run test --coverage
      - name: Download pinned PocketBase
        run: bun run backend:download
      - name: Verify durable replay against PocketBase
        run: node --test scripts/mcp-replay-integration.mjs
