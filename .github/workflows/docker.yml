name: Main CI
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
on:
  push:
    branches: [main]
  # Publishing uses GITHUB_TOKEN, so its commits cannot trigger the push event above.
  # Wait until SVG conversion and resource updates finish before building the image.
  workflow_run:
    workflows: ["Update Icons and Resources"]
    types: [completed]
    branches: [main]
  # Refresh the share image and its combined catalog count weekly.
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      build_only:
        description: Build both native images without publishing or deploying
        type: boolean
        default: false
      verify_only:
        description: Read-only verification of PocketBase deployment and schema
        type: boolean
        default: false

concurrency:
  group: dashboard-icons-${{ inputs.build_only && github.ref || inputs.verify_only && 'verification' || 'deployment' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ./web

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-images:
    if: >-
      !inputs.verify_only &&
      (inputs.build_only ||
       (github.ref == 'refs/heads/main' &&
        (github.event_name != 'workflow_run' ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository))))
    uses: ./.github/workflows/build-images.yml
    permissions:
      packages: write
      contents: read
    with:
      ref: ${{ github.ref }}
      publish: ${{ !inputs.build_only }}

  build-and-push:
    if: ${{ !inputs.build_only && github.ref == 'refs/heads/main' }}
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-images.outputs.revision }}
          sparse-checkout: web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check PocketBase data-node placement before rollout
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_POCKETBASE_APPLICATION_ID: ${{ vars.DOKPLOY_POCKETBASE_APPLICATION_ID }}
        run: node scripts/deploy-pocketbase.mjs --inspect

      - name: Check frontend application access before backend rollout
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_FRONTEND_APPLICATION_ID: ${{ vars.DOKPLOY_FRONTEND_APPLICATION_ID }}
        run: node scripts/deploy-pocketbase.mjs --frontend --inspect

      - name: Back up PocketBase before updating its image or schema
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN: ${{ secrets.PB_ADMIN }}
          PB_ADMIN_PASS: ${{ secrets.PB_ADMIN_PASS }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
        run: node scripts/verify-pocketbase-schema.mjs --backup

      - name: Deploy PocketBase and wait for migrations
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_POCKETBASE_APPLICATION_ID: ${{ vars.DOKPLOY_POCKETBASE_APPLICATION_ID }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-images.outputs.digest }}
          EXPECTED_REVISION: ${{ needs.build-images.outputs.revision }}
        run: node scripts/deploy-pocketbase.mjs

      - name: Verify PocketBase schema and packaged migrations
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN: ${{ secrets.PB_ADMIN }}
          PB_ADMIN_PASS: ${{ secrets.PB_ADMIN_PASS }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
        run: node scripts/verify-pocketbase-schema.mjs --require-proposals --require-current

      - name: Deploy frontend and wait for Swarm convergence
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_FRONTEND_APPLICATION_ID: ${{ vars.DOKPLOY_FRONTEND_APPLICATION_ID }}
          DEPLOY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-images.outputs.digest }}
          EXPECTED_REVISION: ${{ needs.build-images.outputs.revision }}
        run: node scripts/deploy-pocketbase.mjs --frontend

      # Notify IndexNow engines (Bing and others) of icon pages changed since the last deployment.
      - name: Ping IndexNow with changed icon pages
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ping-indexnow.mjs

      - name: Report incomplete deployment
        if: ${{ failure() }}
        run: |
          echo '::error::Deployment incomplete. Check backend startup/schema verification before retrying the frontend rollout.'
          echo '### Deployment incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo 'The backend may already have the new schema while the old frontend remains active. Follow the PocketBase recovery instructions in web/README.md; use the verified pre-deployment backup if rollback is required.' >> "$GITHUB_STEP_SUMMARY"

  verify-deployment:
    if: ${{ inputs.verify_only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect PocketBase application without deploying
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_POCKETBASE_APPLICATION_ID: ${{ vars.DOKPLOY_POCKETBASE_APPLICATION_ID }}
        run: node scripts/deploy-pocketbase.mjs --inspect
      - name: Inspect frontend rollout without deploying
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_FRONTEND_APPLICATION_ID: ${{ vars.DOKPLOY_FRONTEND_APPLICATION_ID }}
        run: node scripts/deploy-pocketbase.mjs --frontend --inspect
      - name: Inspect PocketBase schema without changing records
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN: ${{ secrets.PB_ADMIN }}
          PB_ADMIN_PASS: ${{ secrets.PB_ADMIN_PASS }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
        run: node scripts/verify-pocketbase-schema.mjs --require-proposals --require-current
