name: Main CI
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
on:
  push:
    branches: [main]
  # Publishing uses GITHUB_TOKEN, so its commits cannot trigger the push event above.
  # Wait until SVG conversion and resource updates finish before building the image.
  workflow_run:
    workflows: ["Update Icons and Resources"]
    types: [completed]
    branches: [main]
  # Refresh the share image and its combined catalog count weekly.
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      verify_only:
        description: Read-only verification of PocketBase deployment and schema
        type: boolean
        default: false

concurrency:
  group: dashboard-icons-${{ inputs.verify_only && 'verification' || 'deployment' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ./web

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # PNPM store location
  PNPM_STORE_PATH: ~/.local/share/pnpm/store
  NEXT_PUBLIC_POSTHOG_KEY: phc_fNHNUqEQJHL2DHlwyaPniHOcpEwe8rFPeJEcPbuifC6
  NEXT_PUBLIC_POSTHOG_HOST: https://hog.homarr.dev
  NEXT_PUBLIC_DISABLE_POSTHOG: false
  NEXT_PUBLIC_POCKETBASE_URL: /pb
  CI_MODE: true

jobs:
  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  build-and-push:
    if: >-
      !inputs.verify_only &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install share-image generator dependencies
        run: pnpm install --frozen-lockfile

      # The path build context below includes this generated asset.
      - name: Refresh share image
        run: pnpm generate:og
        env:
          OG_REFRESH_COUNT: "true"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        env:
          NEXT_PUBLIC_POCKETBASE_URL: ${{ env.NEXT_PUBLIC_POCKETBASE_URL }}
        with:
          platforms: linux/amd64,linux/arm64
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          pull: true
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ env.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_DISABLE_POSTHOG=${{ env.NEXT_PUBLIC_DISABLE_POSTHOG }}
            NEXT_PUBLIC_POCKETBASE_URL=${{ env.NEXT_PUBLIC_POCKETBASE_URL }}
            CI_MODE=${{ env.CI_MODE }}
            MCP_SERVER_BUILD=${{ github.sha }}
          secrets: |
            "github_token=${{ secrets.GITHUB_TOKEN }}"

      # Refresh the separate backend from latest before deploying the frontend.
      - name: Back up PocketBase before updating its image or schema
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN: ${{ secrets.PB_ADMIN }}
          PB_ADMIN_PASS: ${{ secrets.PB_ADMIN_PASS }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
        run: node scripts/verify-pocketbase-schema.mjs --backup

      - name: Deploy PocketBase and wait for migrations
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_POCKETBASE_APPLICATION_ID: ${{ vars.DOKPLOY_POCKETBASE_APPLICATION_ID }}
          POCKETBASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: node scripts/deploy-pocketbase.mjs

      - name: Verify PocketBase schema and packaged migrations
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN: ${{ secrets.PB_ADMIN }}
          PB_ADMIN_PASS: ${{ secrets.PB_ADMIN_PASS }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
        run: node scripts/verify-pocketbase-schema.mjs --require-proposals --require-current

      - name: Deploy frontend to Dokploy
        env:
          DOKPLOY_DEPLOY_HOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body --silent --show-error --request POST "$DOKPLOY_DEPLOY_HOOK_URL"

      - name: Report incomplete deployment
        if: ${{ failure() }}
        run: |
          echo '::error::Deployment incomplete. Check backend startup/schema verification before retrying the frontend rollout.'
          echo '### Deployment incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo 'The backend may already have the new schema while the old frontend remains active. Follow the PocketBase recovery instructions in web/README.md; use the verified pre-deployment backup if rollback is required.' >> "$GITHUB_STEP_SUMMARY"

  verify-deployment:
    if: ${{ inputs.verify_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect PocketBase application without deploying
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_POCKETBASE_APPLICATION_ID: ${{ vars.DOKPLOY_POCKETBASE_APPLICATION_ID }}
        run: node scripts/deploy-pocketbase.mjs --inspect
      - name: Inspect PocketBase schema without changing records
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN: ${{ secrets.PB_ADMIN }}
          PB_ADMIN_PASS: ${{ secrets.PB_ADMIN_PASS }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
        run: node scripts/verify-pocketbase-schema.mjs --require-proposals --require-current
