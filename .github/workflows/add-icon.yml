name: Add Icon to Collection
run-name: ${{ inputs.batchId && format('Publish {0}', inputs.batchId) || 'Add Icon to Collection' }}

on:
  workflow_call:
    inputs:
      submissionIds:
        description: Comma-separated IDs of the PocketBase submissions to import
        required: true
        type: string
      batchId:
        description: Dashboard publish batch ID (optional)
        required: false
        default: ""
        type: string
      dryRun:
        description: When true, skip writes/commit/PocketBase status update
        required: false
        default: false
        type: boolean
    secrets:
      PB_URL:
        required: true
      PB_ADMIN_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      submissionIds:
        description: Comma-separated IDs of the PocketBase submissions to import
        required: true
        type: string
      batchId:
        description: Dashboard publish batch ID (optional)
        required: false
        default: ""
        type: string
      dryRun:
        description: When true, skip writes/commit/PocketBase status update
        required: false
        default: false
        type: boolean

concurrency:
  group: add-icon-queue
  cancel-in-progress: false

jobs:
  add-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record running batch
        if: ${{ inputs.batchId && !inputs.dryRun }}
        continue-on-error: true
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
          PUBLISH_BATCH_ID: ${{ inputs.batchId }}
          PUBLISH_STATE: running
        run: bun run scripts/finalize-icon-publication.ts

      - name: Import icons from PocketBase submissions
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
          DRY_RUN: ${{ inputs.dryRun }}
          SUBMISSION_IDS: ${{ inputs.submissionIds }}
          PUBLISH_BATCH_ID: ${{ inputs.batchId }}
        run: |
          IFS=',' read -ra IDS <<< "$SUBMISSION_IDS"
          for submission_id in "${IDS[@]}"; do
            submission_id=$(echo "$submission_id" | xargs)
            if [ -z "$submission_id" ]; then
              continue
            fi
            echo "::group::Processing submission $submission_id"
            
            ARGS=(--submission-id "$submission_id")
            if [ "$DRY_RUN" = "true" ]; then
              ARGS+=("--dry-run")
            fi
            message_file="$(mktemp)"
            ARGS+=("--commit-message" "$message_file")
            
            bun run scripts/import-icon.ts "${ARGS[@]}"
            
            if [ "$DRY_RUN" != "true" ] && ! git diff --quiet; then
              git add .
              git commit -F "$message_file"
            fi

            rm -f "$message_file" || true
            
            echo "::endgroup::"
          done

      - name: Push changes
        id: push
        if: ${{ !inputs.dryRun }}
        env:
          PUBLISH_BATCH_ID: ${{ inputs.batchId }}
        run: |
          if [ -n "$PUBLISH_BATCH_ID" ]; then
            git commit --allow-empty -m "Publish dashboard batch" -m "Dashboard-Publish-Batch: $PUBLISH_BATCH_ID"
          fi
          if [ "$(git rev-list --count HEAD ^origin/main)" -gt 0 ]; then
            git pull --rebase
            git push
          else
            echo "No commits to push"
          fi


          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record pushed commit
        if: ${{ steps.push.outcome == 'success' && !inputs.dryRun && inputs.batchId }}
        continue-on-error: true
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
          PUBLISH_BATCH_ID: ${{ inputs.batchId }}
          PUBLISH_STATE: running
          PUBLISHED_COMMIT: ${{ steps.push.outputs.sha }}
        run: bun run scripts/finalize-icon-publication.ts

      - name: Finalize published submissions
        if: ${{ steps.push.outcome == 'success' && !inputs.dryRun }}
        continue-on-error: ${{ inputs.batchId != '' }}
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
          PUBLISH_BATCH_ID: ${{ inputs.batchId }}
          SUBMISSION_IDS: ${{ inputs.submissionIds }}
          PUBLISH_STATE: succeeded
          PUBLISHED_COMMIT: ${{ steps.push.outputs.sha }}
        run: bun run scripts/finalize-icon-publication.ts

      - name: Record unsuccessful run
        if: ${{ (failure() || cancelled()) && steps.push.outcome != 'success' && inputs.batchId && !inputs.dryRun }}
        continue-on-error: true
        env:
          PB_URL: ${{ secrets.PB_URL }}
          PB_ADMIN_TOKEN: ${{ secrets.PB_ADMIN_TOKEN }}
          PUBLISH_BATCH_ID: ${{ inputs.batchId }}
          PUBLISH_STATE: ${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}
          PUBLISH_MESSAGE: Import or push did not complete. See the GitHub run for details.
        run: bun run scripts/finalize-icon-publication.ts
