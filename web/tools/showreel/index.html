<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dashboard Icons — Motion Reel</title>
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1920px; height: 1080px; overflow: hidden; background: #06080d; }
	body { font-family: "Inter", system-ui, sans-serif; color: #f8fafc; -webkit-font-smoothing: antialiased; }
	#stage, #cam, .layer { position: absolute; inset: 0; }
	#stage { overflow: hidden; background: #06080d; }
	.abs { position: absolute; }
	.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
	.mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.07em 0.16em; margin: -0.04em -0.07em -0.16em; }
	.word { display: inline-block; transform-origin: 0 100%; }
	.grad { background: linear-gradient(110deg, #FA5352 0%, #FF6A48 38%, #FFA500 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
	.kicker { font-family: "JetBrains Mono", monospace; font-size: 17px; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; color: #FFA500; }
	.display { font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
	.orb { position: absolute; border-radius: 50%; }
	.dots { position: absolute; inset: -88px; background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1.2px, transparent 1.7px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse 72% 68% at 50% 50%, #000 25%, transparent 100%); }
	#grain { position: absolute; inset: 0; width: 1920px; height: 1080px; image-rendering: pixelated; opacity: 0.1; mix-blend-mode: overlay; }
	#vignette { background: radial-gradient(ellipse 85% 80% at 50% 50%, transparent 50%, rgba(0,0,0,0.6) 100%); }

	/* wall */
	#wall { position: absolute; left: 50%; top: 50%; }
	.wrow { position: absolute; left: 0; display: flex; gap: 22px; }
	.wtile { flex: none; width: 150px; height: 150px; border-radius: 36px; background: #10161f; border: 1.5px solid #212b3a; display: grid; place-items: center; }
	.wtile img { width: 86px; height: 86px; object-fit: contain; }


	/* logo */
	.cell { position: absolute; transform-style: preserve-3d; }
	.face { position: absolute; inset: 0; backface-visibility: hidden; }
	.back { transform: rotateY(180deg); background: #131a26; border-radius: 22%; box-shadow: inset 0 0 0 0.55px rgba(255,255,255,0.09); }
	.back img, .slot img { position: absolute; left: 16%; top: 16%; width: 68%; height: 68%; object-fit: contain; }

	/* shared ui */
	.window { background: linear-gradient(180deg, #0f1521, #0a0f17); border: 1px solid rgba(255,255,255,0.09); border-radius: 22px; box-shadow: 0 60px 140px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06); overflow: hidden; }
	.winbar { height: 56px; display: flex; align-items: center; gap: 9px; padding: 0 22px; border-bottom: 1px solid rgba(255,255,255,0.06); font-family: "JetBrains Mono", monospace; font-size: 15px; color: #64748b; }
	.winbar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
	.chip { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 19px; font-weight: 600; color: #e2e8f0; }
	.chip img { width: 24px; height: 24px; object-fit: contain; }

	/* code */
	.code { font-family: "JetBrains Mono", monospace; font-size: 24px; line-height: 1.75; white-space: pre; }
	.c-k { color: #c4a5ff; } .c-v { color: #93c5fd; } .c-p { color: #7c8aa0; } .c-s { color: #86efac; } .c-t { color: #fb7185; } .c-a { color: #fdba74; }
	.c-n { color: #fff; font-weight: 700; border-radius: 4px; }
	.c-n.sel { background: #2f5d9c; }
	.caret { display: inline-block; width: 3px; height: 1.1em; background: #FFA500; vertical-align: -0.2em; margin-left: 1px; }

	/* dashboard mock */
	.tile { position: absolute; width: 166px; height: 122px; border-radius: 20px; }
	.tile .empty { position: absolute; inset: 0; border-radius: 20px; border: 1.5px dashed rgba(255,255,255,0.11); display: grid; place-items: center; color: rgba(255,255,255,0.15); font-size: 30px; font-weight: 300; }
	.tile .full { position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(180deg, #172031, #121a28); border: 1px solid rgba(255,255,255,0.08); }
	.tile .full img { position: absolute; left: 55px; top: 18px; width: 56px; height: 56px; object-fit: contain; }
	.tile .full span { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 15px; font-weight: 600; color: #cbd5e1; }

	/* chat */
	.bubble { position: absolute; font-size: 24px; line-height: 1.4; }
	.pill { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 999px; font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
	<defs>
		<filter id="fy1" x="-5%" y="-60%" width="110%" height="220%"><feGaussianBlur stdDeviation="0 0" /></filter>
		<filter id="fy2" x="-5%" y="-60%" width="110%" height="220%"><feGaussianBlur stdDeviation="0 0" /></filter>
		<filter id="fy3" x="-5%" y="-60%" width="110%" height="220%"><feGaussianBlur stdDeviation="0 0" /></filter>
		<filter id="fx1" x="-60%" y="-5%" width="220%" height="110%"><feGaussianBlur stdDeviation="0 0" /></filter>
		<filter id="fx2" x="-60%" y="-5%" width="220%" height="110%"><feGaussianBlur stdDeviation="0 0" /></filter>
	</defs>
</svg>
<div id="stage"><div id="cam"></div></div>
<script>
const W = 1920
const H = 1080
const DURATION = 22
const ROOT = "../../../"
const png = (name) => `${ROOT}png/${name}.png`

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const prog = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, p) => a + (b - a) * p
const mod = (a, n) => ((a % n) + n) % n
const E = {
	lin: (p) => p,
	outCubic: (p) => 1 - (1 - p) ** 3,
	inCubic: (p) => p ** 3,
	inOutCubic: (p) => {
		if (p < 0.5) return 4 * p ** 3
		return 1 - (-2 * p + 2) ** 3 / 2
	},
	outQuart: (p) => 1 - (1 - p) ** 4,
	outQuint: (p) => 1 - (1 - p) ** 5,
	outExpo: (p) => (1 - 2 ** (-10 * p)) / (1 - 2 ** -10),
	inExpo: (p) => (2 ** (10 * p) - 1) / (2 ** 10 - 1),
	inOutExpo: (p) => {
		if (p < 0.5) return E.inExpo(p * 2) / 2
		return 0.5 + E.outExpo(p * 2 - 1) / 2
	},
	outBack: (p) => 1 + 2.8 * (p - 1) ** 3 + 1.8 * (p - 1) ** 2,
}
const tw = (t, a, b, from, to, ease = E.outCubic) => lerp(from, to, ease(prog(t, a, b)))
function spring(dt, freq = 2.6, damping = 0.42) {
	if (dt <= 0) return 0
	const w = 2 * Math.PI * freq
	const wd = w * Math.sqrt(1 - damping * damping)
	return 1 - Math.exp(-damping * w * dt) * (Math.cos(wd * dt) + ((damping * w) / wd) * Math.sin(wd * dt))
}
// Decaying wobble used for "punch" accents.
function punch(t, at, amount = 0.08, freq = 22, decay = 9) {
	if (t < at) return 0
	const dt = t - at
	return amount * Math.exp(-dt * decay) * Math.cos(dt * freq)
}
function rng(seed) {
	return () => {
		seed = (seed + 0x6d2b79f5) | 0
		let x = Math.imul(seed ^ (seed >>> 15), 1 | seed)
		x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x
		return ((x ^ (x >>> 14)) >>> 0) / 4294967296
	}
}
const hexA = (hex, a) => {
	const n = parseInt(hex.slice(1), 16)
	return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`
}

// ---------- dom ----------
function h(tag, props = {}, ...kids) {
	const node = document.createElement(tag)
	for (const [key, value] of Object.entries(props)) {
		if (key === "css") node.style.cssText = value
		else if (key === "class") node.className = value
		else if (key === "text") node.textContent = value
		else if (key === "html") node.innerHTML = value
		else node.setAttribute(key, value)
	}
	node.append(...kids)
	return node
}
function sv(tag, attrs = {}) {
	const node = document.createElementNS("http://www.w3.org/2000/svg", tag)
	for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value)
	return node
}
const img = (name, css = "") => h("img", { src: png(name), css, decoding: "sync", alt: "" })
function blurCss(amount) {
	if (amount < 0.05) return "none"
	return `blur(${amount.toFixed(2)}px)`
}
function put(node, { x = 0, y = 0, s = 1, r = 0, o = 1, blur = 0, extra = "" } = {}) {
	node.style.transform = `translate(${x}px, ${y}px) scale(${s}) rotate(${r}deg) ${extra}`
	node.style.opacity = o
	node.style.filter = blurCss(blur)
}
function dirBlur(node, id, amount, axis) {
	if (amount < 0.1) {
		node.style.filter = "none"
		return
	}
	const blur = document.querySelector(`#${id} feGaussianBlur`)
	if (axis === "x") blur.setAttribute("stdDeviation", `${amount} 0`)
	else blur.setAttribute("stdDeviation", `0 ${amount}`)
	node.style.filter = `url(#${id})`
}
// "Every *app*" -> masked words, *wrapped* words get the brand gradient.
function words(text) {
	const node = h("span")
	const list = []
	text.split(" ").forEach((raw, i) => {
		let cls = "word"
		let label = raw
		if (raw.startsWith("*")) {
			cls = "word grad"
			label = raw.replaceAll("*", "")
		}
		const inner = h("span", { class: cls, text: label })
		if (i > 0) node.append(" ")
		node.append(h("span", { class: "mask" }, inner))
		list.push(inner)
	})
	return { node, list }
}
function reveal(list, t, start, { stagger = 0.06, dur = 0.6, out = 1e9, outDur = 0.35 } = {}) {
	list.forEach((word, i) => {
		const pin = E.outExpo(prog(t, start + i * stagger, start + i * stagger + dur))
		const pout = E.inCubic(prog(t, out + i * stagger * 0.5, out + i * stagger * 0.5 + outDur))
		word.style.transform = `translateY(${(1 - pin) * 108 - pout * 108}%) rotate(${(1 - pin) * 7}deg)`
	})
}
const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#*+<>_"
function kicker(text, css = "") {
	const node = h("div", { class: "kicker", css })
	node.dataset.text = text.toUpperCase()
	return node
}
// Decoder-style text reveal: hidden → random glyphs → final characters, left to right.
function scramble(node, t, a, b) {
	const text = node.dataset.text
	const rand = rng(Math.floor(t * 24) * 131 + text.length)
	let out = ""
	for (let i = 0; i < text.length; i++) {
		const ch = text[i]
		const at = a + ((b - a) * i) / text.length
		if (ch === " ") out += " "
		else if (t >= at + 0.14) out += ch
		else if (t >= at) out += `<span style="color:#fff">${GLYPHS[Math.floor(rand() * GLYPHS.length)]}</span>`
		else out += `<span style="opacity:0">${ch}</span>`
	}
	node.innerHTML = out
}

const cam = document.getElementById("cam")
const stage = document.getElementById("stage")
function layer(parent, id, css = "") {
	const node = h("div", { id, class: "layer", css })
	parent.append(node)
	return node
}

// ---------- audio cue sheet (consumed by audio.py) ----------
const EVENTS = []
const cue = (t, type, v = 1, d = 0) => EVENTS.push({ t: Number(t.toFixed(4)), type, v, d })

// ---------- icon pools ----------
const POOL = [
	"adguard-home", "audiobookshelf", "authentik", "bazarr", "bookstack", "calibre-web", "changedetection", "dozzle", "freshrss",
	"homepage", "emby", "sonarr", "qbittorrent", "nextcloud", "filebrowser", "lidarr", "firefly-iii", "home-assistant",
	"docker", "homarr", "radarr", "plex", "jellyfin", "immich", "gitea", "overseerr", "glances", "paperless-ngx", "mealie", "navidrome",
	"syncthing", "uptime-kuma", "vaultwarden-light", "kavita", "photoprism", "prowlarr", "grafana", "proxmox", "n8n", "truenas", "tailscale-light",
	"traefik", "actual-budget", "miniflux-light", "nginx-proxy-manager", "prometheus", "sabnzbd", "searxng", "unraid", "vikunja", "wireguard",
	"transmission", "zigbee2mqtt", "redis", "nginx", "beszel", "jellyseerr", "heimdall-light", "cloudflare", "pi-hole", "open-webui-light",
	"frigate-light", "node-red", "esphome", "caddy", "tautulli", "forgejo", "bitwarden", "netdata", "influxdb", "postgres", "mariadb", "minio-light",
	"kopia", "stirling-pdf", "it-tools", "code-server", "gitlab", "spotify", "netflix", "steam", "discord", "slack", "telegram", "youtube",
	"synology", "opnsense", "pfsense", "kubernetes", "rancher", "argo-cd", "jenkins", "sentry-light", "dashy", "memos", "excalidraw", "wallos",
]

// ================= BACKGROUND =================
const bg = layer(cam, "bg")
const orbs = [
	{ c: "250,83,82", a: 0.2, x: 0.18, y: 0.28, r: 1100, fx: 0.07, fy: 0.09 },
	{ c: "255,165,0", a: 0.1, x: 0.82, y: 0.72, r: 1200, fx: 0.05, fy: 0.08 },
	{ c: "96,165,250", a: 0.09, x: 0.72, y: 0.18, r: 900, fx: 0.08, fy: 0.06 },
].map((orb) => {
	orb.node = h("div", { class: "orb", css: `width:${orb.r}px;height:${orb.r}px;background:radial-gradient(circle, rgba(${orb.c},1) 0%, rgba(${orb.c},0) 62%)` })
	bg.append(orb.node)
	return orb
})
const dots = h("div", { class: "dots" })
bg.append(dots)

// ================= ICON WALL (shared by the collection and the finale) =================
const wallWrap = layer(cam, "wallWrap")
const wall = h("div", { id: "wall" })
wallWrap.append(wall)
const ROWS = 15
const COLS = 21
const STEP = 172
const ROW_W = COLS * STEP
const wallRows = []
const twinkles = []
{
	const rand = rng(7)
	wall.style.cssText = `width:${ROW_W}px;height:${ROWS * STEP}px;margin-left:${-ROW_W / 2}px;margin-top:${(-ROWS * STEP) / 2}px`
	for (let r = 0; r < ROWS; r++) {
		const row = h("div", { class: "wrow", css: `top:${r * STEP}px` })
		const names = Array.from({ length: COLS }, () => POOL[Math.floor(rand() * POOL.length)])
		for (const name of [...names, ...names]) {
			const tile = h("div", { class: "wtile" }, img(name))
			row.append(tile)
			if (rand() < 0.045) twinkles.push({ tile, f: 0.4 + rand() * 0.5, ph: rand() })
		}
		wall.append(row)
		let dir = 1
		if (r % 2) dir = -1
		wallRows.push({ row, speed: dir * (46 + rand() * 50), phase: rand() * ROW_W })
	}
}

// ================= SCENE 1 — LOGO BUILD =================
const s1 = layer(cam, "s1")
const LOGO = 420
const K = LOGO / 232
const s1Glow = h("div", { class: "abs", css: "left:360px; top:-60px; width:1200px; height:1200px; border-radius:50%; background:radial-gradient(circle, rgba(250,83,82,0.34), rgba(250,83,82,0) 58%)" })
const s1Ring = h("div", { class: "abs", css: "left:740px; top:320px; width:440px; height:440px; border-radius:50%; border:2px solid rgba(255,255,255,0.8)" })
const s1Ring2 = h("div", { class: "abs", css: "left:740px; top:320px; width:440px; height:440px; border-radius:50%; border:1px solid rgba(255,165,0,0.8)" })
const presents = h("div", { class: "abs mono", css: "left:0; right:0; top:236px; text-align:center; font-size:16px; letter-spacing:0.55em; color:rgba(255,255,255,0.62)" })
presents.dataset.text = "HOMARR LABS PRESENTS"
const logo = h("div", { class: "abs", css: `left:${960 - LOGO / 2}px; top:${540 - LOGO / 2}px; width:${LOGO}px; height:${LOGO}px; perspective:1200px;` })
const frameSvg = sv("svg", { viewBox: "0 0 232 232", width: LOGO, height: LOGO, style: "position:absolute; inset:0; overflow:visible" })
const frameRect = sv("rect", { x: 4, y: 4, width: 224, height: 224, rx: 32, fill: "none", stroke: "#fff", "stroke-width": 8, "stroke-linecap": "round" })
frameSvg.append(frameRect)
logo.append(frameSvg)
const CELLS = [
	{ x: 24, y: 24, w: 48, stroke: "#FB7185", icon: "plex" },
	{ x: 92, y: 24, w: 48, stroke: "#ccc", fill: "#FDBA74", icon: "jellyfin" },
	{ x: 158, y: 22, w: 52, fill: "#86EFAC", circle: true, icon: "home-assistant" },
	{ x: 22, y: 90, w: 52, fill: "#93C5FD", circle: true, icon: "nextcloud" },
	{ x: 92, y: 92, w: 48, stroke: "#C4B5FD", icon: "docker" },
	{ x: 160, y: 92, w: 48, stroke: "#ccc", icon: "proxmox" },
	{ x: 24, y: 160, w: 48, fill: "#FDE68A", icon: "immich" },
	{ x: 92, y: 160, w: 48, stroke: "#ccc", icon: "grafana" },
	{ x: 160, y: 160, w: 48, stroke: "#ccc", fill: "#93C5FD", icon: "sonarr" },
]
const CELL_ORDER = [4, 1, 3, 5, 7, 0, 2, 6, 8]
for (const cell of CELLS) {
	let bx = cell.x
	let by = cell.y
	let bw = cell.w
	let radius = `${8 * K}px`
	let border = "none"
	if (cell.stroke) {
		bx -= 2
		by -= 2
		bw += 4
		radius = `${10 * K}px`
		border = `${4 * K}px solid ${cell.stroke}`
	}
	if (cell.circle) radius = "50%"
	cell.size = bw * K
	cell.cx = bx + bw / 2 - 116
	cell.cy = by + bw / 2 - 116
	cell.node = h(
		"div",
		{ class: "cell", css: `left:${bx * K}px; top:${by * K}px; width:${bw * K}px; height:${bw * K}px;` },
		h("div", { class: "face", css: `border:${border}; border-radius:${radius}; background:${cell.fill ?? "transparent"}` }),
		h("div", { class: "face back" }, img(cell.icon)),
	)
	logo.append(cell.node)
}
s1.append(s1Glow, s1Ring, s1Ring2, presents, logo)
cue(0.1, "swell", 1, 2.3)
cue(0.15, "whoosh", 0.55)
cue(0.9, "impact", 0.55)
CELL_ORDER.forEach((_, j) => {
	cue(0.55 + j * 0.055, "pop", 0.45)
	cue(1.32 + j * 0.045, "tick", 0.35)
})
cue(1.9, "riser", 0.8, 0.6)
cue(2.5, "impact", 1)

function renderS1(t) {
	const pin = spring(t - 0.08, 1.5, 0.55)
	const float = Math.sin(t * 2.4) * 5 * (1 - prog(t, 1.6, 2.0))
	const rot = lerp(-120, 0, E.outExpo(prog(t, 0.08, 1.2)))
	put(logo, { y: float, s: lerp(0.12, 1, pin), r: rot })
	frameRect.style.strokeDasharray = `${FRAME_LEN} ${FRAME_LEN}`
	frameRect.style.strokeDashoffset = FRAME_LEN * (1 - E.outQuart(prog(t, 0.12, 0.95)))

	const pz = prog(t, 2.05, 2.5)
	const zoomIn = E.inOutCubic(pz)
	const fling = E.inExpo(pz)
	frameSvg.style.transform = `scale(${1 + fling * 2.6})`
	frameSvg.style.opacity = 1 - E.inCubic(pz)

	CELL_ORDER.forEach((index, j) => {
		const cell = CELLS[index]
		const st = 0.55 + j * 0.055
		const sp = spring(t - st, 2.4, 0.38)
		let sign = -1
		if (j % 2) sign = 1
		const rz = (1 - E.outCubic(prog(t, st, st + 0.5))) * 90 * sign
		const flip = E.inOutCubic(prog(t, 1.32 + j * 0.045, 1.72 + j * 0.045)) * 180
		let scale = sp
		let dx = 0
		let dy = 0
		let o = 1
		if (index === 4) scale *= lerp(1, 360 / cell.size, zoomIn)
		else {
			const len = Math.hypot(cell.cx, cell.cy)
			dx = (cell.cx / len) * fling * 1500
			dy = (cell.cy / len) * fling * 1500
			o = 1 - prog(pz, 0.45, 1)
		}
		let spin = fling * sign * 50
		if (index === 4) spin = 0
		cell.node.style.transform = `translate(${dx}px, ${dy}px) scale(${scale}) rotate(${rz + spin}deg) rotateY(${flip}deg)`
		cell.node.style.opacity = o
	})

	const ring = prog(t, 0.88, 1.7)
	put(s1Ring, { s: lerp(1, 2.6, E.outCubic(ring)), o: 0.55 * (1 - ring) * Math.min(1, ring * 20) })
	const ring2 = prog(t, 0.98, 1.9)
	put(s1Ring2, { s: lerp(1, 3.3, E.outCubic(ring2)), o: 0.45 * (1 - ring2) * Math.min(1, ring2 * 20) })
	s1Glow.style.opacity = tw(t, 0.5, 1.3, 0, 1) * (1 - prog(t, 2.0, 2.45))
	scramble(presents, t, 0.3, 0.9)
	presents.style.opacity = 1 - prog(t, 1.75, 2.05)
	presents.style.letterSpacing = `${tw(t, 0.3, 2.0, 0.9, 0.5, E.outQuart)}em`
}

// ================= SCENE 2 — RAPID FIRE =================
const s2 = layer(cam, "s2")
const s2Cam = layer(s2, "s2cam")

	["docker", "#1d63ed"], ["plex", "#e5a00d"], ["jellyfin", "#aa5cc3"], ["home-assistant", "#18bcf2"], ["immich", "#fa2921"],

function odoPos(v, i) {

// Extracts on-curve anchors and cubic handles so the icon can be "edited" like in a vector tool.
function pathGeometry(d) {
	const tokens = d.match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g)
	const anchors = []
	const handles = []
	let i = 0
	let cmd = "M"
	let cx = 0
	let cy = 0
	let sx = 0
	let sy = 0
	const num = () => Number.parseFloat(tokens[i++])
	while (i < tokens.length) {
		if (/[a-zA-Z]/.test(tokens[i])) cmd = tokens[i++]
		const rel = cmd === cmd.toLowerCase()
		let ox = 0
		let oy = 0
		if (rel) {
			ox = cx
			oy = cy
		}
		const upper = cmd.toUpperCase()
		if (upper === "Z") {
			cx = sx
			cy = sy
			continue
		}
		if (upper === "M") {
			cx = ox + num()
			cy = oy + num()
			sx = cx
			sy = cy
			cmd = "L"
			if (rel) cmd = "l"
		} else if (upper === "L" || upper === "T") {
			cx = ox + num()
			cy = oy + num()
		} else if (upper === "H") cx = ox + num()
		else if (upper === "V") cy = oy + num()
		else if (upper === "C") {
			const x1 = ox + num()
			const y1 = oy + num()
			const x2 = ox + num()
			const y2 = oy + num()
			const px = cx
			const py = cy
			cx = ox + num()
			cy = oy + num()
			handles.push([px, py, x1, y1], [cx, cy, x2, y2])
		} else if (upper === "S" || upper === "Q") {
			i += 2
			cx = ox + num()
			cy = oy + num()
		} else if (upper === "A") {
			i += 5
			cx = ox + num()
			cy = oy + num()
		}
		anchors.push([cx, cy])
	}
	return { anchors, handles }
}

	put(result, { y: (1 - rb) * 40, s: lerp(0.9, 1, rb), o: prog(t, RESULT_T, RESULT_T + 0.08) })

	const exit = E.inCubic(prog(t, 17.25, 17.55))
	s7.style.transform = `translateX(${(1 - E.outExpo(enter)) * 1500}px) scale(${lerp(1, 0.9, exit)})`
	s7.style.opacity = 1 - exit
	if (exit > 0) s7.style.filter = blurCss(exit * 16)
}

// ================= SCENE 8 — COMMUNITY =================
const s8 = layer(cam, "s8")
const s8Kicker = kicker("// 06 — Community-powered", "position:absolute; left:0; right:0; top:150px; text-align:center")
const s8L = words("Submit. Review. *Ship.*")
const s8Head = h("div", { class: "abs display", css: "left:0; right:0; top:192px; text-align:center; font-size:112px" }, s8L.node)
function submissionCard(name, sub) {
	return h(
		"div",
		{ class: "abs", css: "left:590px; top:400px; width:740px; height:156px; border-radius:26px; background:linear-gradient(180deg,#151d2b,#10161f); border:1px solid rgba(255,255,255,0.1); box-shadow:0 40px 100px rgba(0,0,0,0.5); display:flex; align-items:center; gap:26px; padding:0 30px" },
		h("div", { css: "flex:none; width:100px; height:100px; border-radius:26px; background:#1b2434; display:grid; place-items:center" }, img(name, "width:64px; height:64px; object-fit:contain")),
		h("div", { css: "display:flex; flex-direction:column; gap:8px; flex:1" }, h("div", { css: "font-size:36px; font-weight:800; letter-spacing:-0.02em", text: name }), h("div", { class: "mono", css: "font-size:16px; color:#64748b", text: sub })),
	)
}
const ghostB = submissionCard("azure-certificate", "icon submission")
const ghostA = submissionCard("azure-linux", "icon submission")
const card = submissionCard("nextflux", "new icon · svg + png + webp")
const status = h("span", { class: "pill", css: "height:40px; font-size:15px; padding:0 18px" })
card.append(status)
const stamp = h("div", { class: "abs mono", css: "left:1120px; top:372px; padding:8px 18px; border:4px solid #4ade80; border-radius:12px; color:#4ade80; font-size:34px; font-weight:800; letter-spacing:0.12em; background:rgba(6,8,13,0.6)", text: "APPROVED" })
const PIPE_X = [610, 960, 1310]
const PIPE_Y = 700
const PIPE_T = [17.45, 17.72, 17.99]
const pipeBase = h("div", { class: "abs", css: `left:${PIPE_X[0]}px; top:${PIPE_Y - 2}px; width:${PIPE_X[2] - PIPE_X[0]}px; height:4px; border-radius:4px; background:rgba(255,255,255,0.08)` })
const pipeFill = h("div", { class: "abs", css: `left:${PIPE_X[0]}px; top:${PIPE_Y - 2}px; width:${PIPE_X[2] - PIPE_X[0]}px; height:4px; border-radius:4px; background:linear-gradient(90deg,#FA5352,#FFA500); transform-origin:0 50%; box-shadow:0 0 20px rgba(250,83,82,0.7)` })
const pipeNodes = ["Submitted", "Approved", "Published"].map((label, i) => {
	const dot = h("div", { class: "abs", css: `left:${PIPE_X[i] - 14}px; top:${PIPE_Y - 14}px; width:28px; height:28px; border-radius:50%; background:#0f1520; border:3px solid #334155` })
	const text = h("div", { class: "abs mono", css: `left:${PIPE_X[i] - 150}px; top:${PIPE_Y + 30}px; width:300px; text-align:center; font-size:16px; letter-spacing:0.22em; text-transform:uppercase; color:#64748b`, text: label })
	const halo = h("div", { class: "abs", css: `left:${PIPE_X[i] - 14}px; top:${PIPE_Y - 14}px; width:28px; height:28px; border-radius:50%; border:2px solid #FFA500` })
	return { dot, text, halo }
})
const commit = h("div", { class: "abs mono", css: "left:0; right:0; top:840px; text-align:center; font-size:19px; color:#64748b", html: '<span style="color:#4ade80">✓</span> chore: add icon "nextflux" <span style="color:#334155">·</span> <span style="color:#FFA500">81b4ab25</span> <span style="color:#334155">·</span> live on the CDN' })
const confetti = h("div", { class: "layer" })
const CONFETTI = []
{
	const rand = rng(42)
	const colors = ["#FB7185", "#FDBA74", "#86EFAC", "#93C5FD", "#C4B5FD", "#FDE68A", "#FA5352", "#FFA500"]
	for (let i = 0; i < 90; i++) {
		const angle = -Math.PI / 2 + (rand() - 0.5) * 2.4
		const speed = 700 + rand() * 1100
		const node = h("div", { class: "abs", css: `left:0; top:0; width:${8 + rand() * 8}px; height:${12 + rand() * 10}px; border-radius:2px; background:${colors[i % colors.length]}` })
		confetti.append(node)
		CONFETTI.push({ node, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, spin: (rand() - 0.5) * 1400, x0: 960 + (rand() - 0.5) * 500, delay: rand() * 0.06 })
	}
}
s8.append(s8Kicker, s8Head, pipeBase, pipeFill, ...pipeNodes.flatMap((node) => [node.halo, node.dot, node.text]), ghostB, ghostA, card, stamp, commit, confetti)
PIPE_T.forEach((at) => cue(at, "pop", 0.6))
cue(PIPE_T[1], "stamp", 1)
cue(PIPE_T[2] + 0.02, "confetti", 0.9)

function renderS8(t) {
	const exit = E.inCubic(prog(t, 18.82, 19.12))
	put(s8, { s: lerp(1, 0.92, exit), o: 1 - exit, blur: exit * 14 })
	scramble(s8Kicker, t, 17.35, 17.75)
	s8L.list.forEach((word, i) => {
		const p = E.outExpo(prog(t, PIPE_T[i] - 0.06, PIPE_T[i] + 0.45))
		word.style.transform = `translateY(${(1 - p) * 108}%) rotate(${(1 - p) * 7}deg)`
	})
	const enter = spring(t - 17.3, 2.2, 0.5)
	put(card, { y: (1 - enter) * 120 + punch(t, PIPE_T[1], 10, 30, 10), s: 1 + punch(t, PIPE_T[2], 0.05, 22, 8), o: prog(t, 17.3, 17.42) })
	put(ghostA, { y: (1 - enter) * 120 - 26, s: 0.94, o: prog(t, 17.34, 17.48) * 0.5 })
	put(ghostB, { y: (1 - enter) * 120 - 50, s: 0.88, o: prog(t, 17.38, 17.52) * 0.25 })
	ghostA.style.zIndex = 0
	let label = "PENDING REVIEW"
	let color = "#fbbf24"
	if (t >= PIPE_T[1]) {
		label = "APPROVED"
		color = "#4ade80"
	}
	if (t >= PIPE_T[2]) {
		label = "PUBLISHED"
		color = "#FFA500"
	}
	status.textContent = label
	status.style.color = color
	status.style.background = hexA(color, 0.12)
	status.style.border = `1px solid ${hexA(color, 0.35)}`
	const st = prog(t, PIPE_T[1], PIPE_T[1] + 0.14)
	put(stamp, { s: lerp(2.4, 1, E.inCubic(st)), r: -9, o: Math.min(1, st * 3) * (1 - prog(t, PIPE_T[2] + 0.2, PIPE_T[2] + 0.4)) })

	pipeFill.style.transform = `scaleX(${tw(t, PIPE_T[0], PIPE_T[2], 0, 1, E.inOutCubic)})`
	pipeNodes.forEach((node, i) => {
		const lit = t >= PIPE_T[i]
		const s = 1 + punch(t, PIPE_T[i], 0.5, 24, 9)
		put(node.dot, { s })
		node.dot.style.background = "#0f1520"
		node.dot.style.borderColor = "#334155"
		node.text.style.color = "#64748b"
		if (lit) {
			node.dot.style.background = "linear-gradient(135deg,#FA5352,#FFA500)"
			node.dot.style.borderColor = "#FFA500"
			node.text.style.color = "#f8fafc"
		}
		const halo = prog(t, PIPE_T[i], PIPE_T[i] + 0.6)
		put(node.halo, { s: lerp(1, 3.4, E.outCubic(halo)), o: (1 - halo) * Number(halo > 0) })
	})
	put(commit, { y: (1 - E.outExpo(prog(t, PIPE_T[2] + 0.05, PIPE_T[2] + 0.5))) * 20, o: prog(t, PIPE_T[2] + 0.05, PIPE_T[2] + 0.2) })
	for (const bit of CONFETTI) {
		const dt = t - (PIPE_T[2] + bit.delay)
		if (dt <= 0) {
			bit.node.style.opacity = 0
			continue
		}
		const x = bit.x0 + bit.vx * dt
		const y = 470 + bit.vy * dt + 0.5 * 2200 * dt * dt
		put(bit.node, { x, y, r: bit.spin * dt, o: 1 - prog(dt, 0.6, 1.0), extra: `rotateX(${dt * 720}deg)` })
	}
}

// ================= SCENE 9 — FINALE =================
const s9 = layer(cam, "s9")
const s9Glow = h("div", { class: "abs", css: "left:260px; top:-160px; width:1400px; height:1400px; border-radius:50%; background:radial-gradient(circle, rgba(250,83,82,0.3), rgba(255,165,0,0.08) 40%, rgba(0,0,0,0) 62%)" })
const swarm = h("div", { class: "layer" })
const SWARM = []
{
	const rand = rng(99)
	for (let i = 0; i < 96; i++) {
		const node = img(POOL[i % POOL.length], "position:absolute; left:-36px; top:-36px; width:72px; height:72px; object-fit:contain")
		swarm.append(node)
		SWARM.push({ node, a0: rand() * Math.PI * 2, r0: 560 + rand() * 620, spin: 1.8 + rand() * 1.4, start: 18.9 + rand() * 0.35, rot: (rand() - 0.5) * 720 })
	}
}
const IMPACT = 19.75
const rings = [0, 0.1, 0.22].map((delay, i) => {
	const ring = h("div", { class: "abs", css: `left:760px; top:340px; width:400px; height:400px; border-radius:50%; border:${3 - i}px solid ${["#fff", "#FFA500", "#FA5352"][i]}` })
	return { ring, delay }
})
const finalLogo = h("img", { src: `${ROOT}svg/dashboard-icons-dark.svg`, class: "abs", css: "left:0; top:0; width:200px; height:200px", alt: "" })
const wordmark = h("div", { class: "abs display", css: "left:0; top:0; font-size:156px; white-space:nowrap; letter-spacing:-0.05em" })
const letters = []
for (const ch of "Dashboard Icons") {
	if (ch === " ") {
		wordmark.append(h("span", { css: "display:inline-block; width:0.24em" }))
		continue
	}
	const inner = h("span", { class: "word", text: ch })
	wordmark.append(h("span", { class: "mask" }, inner))
	letters.push(inner)
}
const shine = h("div", { class: "abs display", css: "left:0; top:0; font-size:156px; white-space:nowrap; letter-spacing:-0.05em; color:#fff; -webkit-mask-image:linear-gradient(100deg, transparent 42%, #000 50%, transparent 58%); -webkit-mask-size:300% 100%; -webkit-mask-repeat:no-repeat", text: "Dashboard Icons" })
const tagline = words("Your definitive source for *dashboard* *icons.*")
const taglineNode = h("div", { class: "abs", css: "left:0; right:0; top:640px; text-align:center; font-size:42px; font-weight:600; letter-spacing:-0.02em; color:#cbd5e1" }, tagline.node)
const chips = [
	h("span", { class: "chip", css: "background:linear-gradient(135deg,#FA5352,#FFA500); border:none; color:#fff; font-weight:800" }, "dashboardicons.com"),
	h("span", { class: "chip" }, "Free & open source"),
	h("span", { class: "chip" }, "SVG · PNG · WEBP"),
	h("span", { class: "chip" }, "CDN + MCP ready"),
]
const chipRow = h("div", { class: "abs", css: "left:0; right:0; top:740px; display:flex; justify-content:center; gap:14px" }, ...chips)
const s9Shade = h("div", { class: "layer", css: "background: radial-gradient(ellipse 60% 40% at 50% 52%, rgba(6,8,13,0.85), rgba(6,8,13,0) 100%)" })
const flash = h("div", { class: "layer", css: "background:radial-gradient(circle at 50% 46%, rgba(255,255,255,0.95), rgba(255,200,150,0.5) 25%, rgba(250,83,82,0) 60%)" })
s9.append(s9Shade, s9Glow, swarm, ...rings.map((r) => r.ring), finalLogo, wordmark, shine, taglineNode, chipRow, flash)
let LAYOUT = { logoX: 0, wordX: 0, y: 0 }
cue(18.85, "riser", 1, IMPACT - 18.85)
cue(IMPACT, "boom", 1)
letters.forEach((_, i) => {
	if (i % 2 === 0) cue(20.02 + i * 0.03, "tick", 0.18)
})
cue(20.55, "shimmer", 0.5, 0.8)
chips.forEach((_, i) => cue(20.8 + i * 0.07, "pop", 0.35))
cue(21.0, "shimmer", 0.6, 0.7)

function renderS9(t) {
	for (const bit of SWARM) {
		const p = prog(t, bit.start, IMPACT)
		if (p <= 0 || p >= 1) {
			bit.node.style.opacity = 0
			continue
		}
		const e = p * p
		const a = bit.a0 + bit.spin * e
		const r = bit.r0 * (1 - e)
		put(bit.node, { x: 960 + Math.cos(a) * r, y: 540 + Math.sin(a) * r * 0.75, s: lerp(1.15, 0.15, e), r: bit.rot * e, o: prog(t, bit.start, bit.start + 0.12) * (1 - prog(p, 0.88, 1)) })
	}
	s9Glow.style.opacity = tw(t, 19.0, IMPACT, 0.2, 1) * (0.85 + Math.sin(t * 3) * 0.1)
	s9Shade.style.opacity = prog(t, IMPACT, IMPACT + 0.5)
	rings.forEach(({ ring, delay }) => {
		const p = prog(t, IMPACT + delay, IMPACT + delay + 0.9)
		put(ring, { s: lerp(0.4, 4.2, E.outCubic(p)), o: (1 - p) * Number(p > 0) })
	})
	flash.style.opacity = Math.exp(-Math.max(0, t - IMPACT) * 6) * Number(t >= IMPACT) + prog(t, IMPACT - 0.12, IMPACT) * 0.4 * Number(t < IMPACT)

	const pop = spring(t - IMPACT, 2.2, 0.38)
	const slide = E.outExpo(prog(t, 20.0, 20.7))
	const lx = lerp(960 - 100, LAYOUT.logoX, slide)
	put(finalLogo, { x: lx, y: LAYOUT.y - 100 + (1 - slide) * 60, s: pop * lerp(1.5, 1, slide), r: (1 - pop) * -90 })
	wordmark.style.transform = `translate(${LAYOUT.wordX}px, ${LAYOUT.y - 96}px)`
	shine.style.transform = wordmark.style.transform
	letters.forEach((letter, i) => {
		const st = 20.02 + i * 0.03
		const p = E.outExpo(prog(t, st, st + 0.7))
		letter.style.transform = `translateY(${(1 - p) * 110}%) rotate(${(1 - p) * 12}deg)`
		letter.style.filter = blurCss((1 - p) * 8)
	})
	shine.style.webkitMaskPosition = `${lerp(120, -20, E.inOutCubic(prog(t, 20.95, 21.7)))}% 0`
	shine.style.opacity = 0.85 * Number(t > 20.95 && t < 21.7)
	reveal(tagline.list, t, 20.45, { stagger: 0.045 })
	chips.forEach((chip, i) => {
		const sp = spring(t - (20.8 + i * 0.07), 2.6, 0.45)
		put(chip, { y: (1 - sp) * 40, s: lerp(0.7, 1, sp), o: prog(t, 20.8 + i * 0.07, 20.9 + i * 0.07) })
	})
}

// ================= HUD / POST =================
const hud = layer(stage, "hud")
const hudBar = h("div", { class: "abs", css: "left:0; bottom:0; height:3px; width:1920px; background:linear-gradient(90deg,#FA5352,#FFA500); transform-origin:0 50%" })
hud.append(hudBar)
const vignette = layer(stage, "vignette")
const grain = h("canvas", { id: "grain", width: 960, height: 540 })
stage.append(grain)
const grainCtx = grain.getContext("2d")
const grainData = grainCtx.createImageData(960, 540)
const fade = layer(stage, "fade", "background:#000")
const SHAKES = [[2.5, 5], [4.62, 9], [8.0, 6], [LAND, 4], [17.72, 7], [IMPACT, 24]]

function renderHud(t) {
	hud.style.opacity = tw(t, 0.5, 1.0, 0, 1) * (1 - prog(t, 18.8, 19.1))
	hudBar.style.transform = `scaleX(${t / DURATION})`
}
function renderGrain(frame) {
	const rand = rng(frame * 7919 + 1)
	const data = grainData.data
	for (let i = 0; i < data.length; i += 4) {
		const v = rand() * 255
		data[i] = v
		data[i + 1] = v
		data[i + 2] = v
		data[i + 3] = 255
	}
	grainCtx.putImageData(grainData, 0, 0)
}
function renderCamera(t) {
	let x = 0
	let y = 0
	for (const [at, amp] of SHAKES) {
		if (t < at) continue
		const dt = t - at
		const k = amp * Math.exp(-dt * 9)
		x += k * Math.sin(dt * 71)
		y += k * Math.cos(dt * 57)
	}
	cam.style.transform = `translate(${x}px, ${y}px)`
}
function renderBackground(t) {
	orbs.forEach((orb, i) => {
		const x = orb.x * W - orb.r / 2 + Math.sin(t * orb.fx * Math.PI * 2 + i) * 160
		const y = orb.y * H - orb.r / 2 + Math.cos(t * orb.fy * Math.PI * 2 + i * 2) * 120
		orb.node.style.transform = `translate(${x}px, ${y}px)`
		orb.node.style.opacity = orb.a * tw(t, 0.2, 1.5, 0, 1)
	})
	dots.style.transform = `translate(${mod(t * 14, 44)}px, ${mod(t * 9, 44)}px)`
}

const SCENES = [
	[s1, 0, 2.5, renderS1],
	[s2, 2.5, 4.62, renderS2],
	[s3, 4.33, 8.02, renderS3],
	[s4, 7.84, 10.8, renderS4],
	[s5, 10.3, 12.35, renderS5],
	[s6, 12.28, 15.64, renderS6],
	[s7, 15.42, 17.56, renderS7],
	[s8, 17.28, 19.14, renderS8],
	[s9, 18.84, DURATION + 1, renderS9],
]

function render(t) {
	renderBackground(t)
	renderWall(t)
	for (const [node, a, b, fn] of SCENES) {
		const on = t >= a && t < b
		node.style.display = "none"
		if (on) {
			node.style.display = "block"
			fn(t)
		}
	}
	renderCamera(t)
	renderHud(t)
	renderGrain(Math.round(t * 60))
	fade.style.opacity = Math.max(1 - prog(t, 0, 0.12), prog(t, DURATION - 0.45, DURATION - 0.02))
}

let FRAME_LEN = 0
function measure() {
	FRAME_LEN = frameRect.getTotalLength()
	for (const def of haPaths) def.len = def.path.getTotalLength()
	s6.style.display = "block"
	line4.innerHTML = line4Html(999, DASH[0][0], false, "none")
	const nameRect = line4.querySelector(".c-n").getBoundingClientRect()
	ORIGIN = { x: nameRect.left + nameRect.width / 2, y: nameRect.top + nameRect.height / 2 }
	s9.style.display = "block"
	const wordW = wordmark.getBoundingClientRect().width
	const wordLeft = wordmark.getBoundingClientRect().left
	for (const letter of letters) {
		const offset = letter.getBoundingClientRect().left - wordLeft
		letter.style.backgroundImage = "linear-gradient(110deg, #FA5352 0%, #FF6A48 40%, #FFA500 100%)"
		letter.style.backgroundSize = `${wordW}px 100%`
		letter.style.backgroundPosition = `${-offset}px 0`
		letter.style.webkitBackgroundClip = "text"
		letter.style.backgroundClip = "text"
		letter.style.color = "transparent"
	}
	const group = 200 + 48 + wordW
	LAYOUT = { logoX: 960 - group / 2, wordX: 960 - group / 2 + 248, y: 470 }
}

window.DURATION = DURATION
window.EVENTS = EVENTS
window.render = render
window.ready = (async () => {
	await Promise.all(["800 100px Inter", "600 40px Inter", "500 20px 'JetBrains Mono'", "700 20px 'JetBrains Mono'"].map((font) => document.fonts.load(font)))
	await document.fonts.ready
	await Promise.all([...document.images].map((node) => node.decode().catch(() => console.warn(`image failed: ${node.src}`))))
	measure()
	render(0)
	return true
})()
</script>
