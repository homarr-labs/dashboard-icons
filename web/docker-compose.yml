services:
  dashboard-icons:
    image: ghcr.io/homarr-labs/dashboard-icons:latest
    pull_policy: always
    ports:
      - "8080:8080"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pb_data:
    name: ${PB_DATA_VOLUME:-dashboard-icons-data}
